# Publie l'application sur GitHub Pages à chaque poussée sur main.
# `enablement: true` active le site Pages lui-même au premier passage : il n'y a
# donc rien à cocher dans les réglages du dépôt — il doit simplement être public
# (Pages sur un dépôt privé demande un abonnement payant).

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle qui est déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        # La racine du dépôt est le site : index.html y est déjà.
        # L'action exclut .git et .github de l'archive.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
